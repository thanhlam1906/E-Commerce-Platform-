spring.application.name=identity-service
spring.profiles.active=local
spring.config.import=optional:file:.env[.properties],optional:configserver:http://localhost:8888
server.port=8082

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/identity?TimeZone=UTC}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# JWT (RS256)
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:keys/private.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:keys/public.pem}

# Kafka (publish identity events: UserRegistered, PasswordResetRequested)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
identity.kafka-topic=${IDENTITY_EVENTS_TOPIC:identity.events}
identity.frontend-base-url=${IDENTITY_FRONTEND_BASE_URL:http://localhost:3000}

# Eureka
# Register with localhost, not the Windows hostname (LENOVO.mshome.net) — the
# Hyper-V DNS suffix is unresolvable, so the gateway's lb:// lookup would fail.
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

# Monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=1.0
