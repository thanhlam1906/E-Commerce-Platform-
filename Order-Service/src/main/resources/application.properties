spring.application.name=order-service
spring.config.import=optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8083}

# PostgreSQL owns orders and inventory so checkout can reserve stock atomically.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/orders?TimeZone=UTC}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis is only for carts and product snapshot cache; stock never depends on Redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

product-catalog.base-url=${PRODUCT_CATALOG_URL:http://localhost:8081}
identity-service.base-url=${IDENTITY_SERVICE_URL:http://localhost:8082}
payment-service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
payment.return-url=${PAYMENT_RETURN_URL:}
internal.service-token=${INTERNAL_SERVICE_TOKEN:}
order.cart-ttl-days=${CART_TTL_DAYS:7}
order.product-cache-ttl-minutes=${PRODUCT_CACHE_TTL_MINUTES:60}
order.outbox-poll-delay-ms=${OUTBOX_POLL_DELAY_MS:1000}
order.kafka-topic=${ORDER_EVENTS_TOPIC:order.events}
order.payment-events-topic=${PAYMENT_EVENTS_TOPIC:payment.events}
order.cod.pending-timeout=${COD_PENDING_TIMEOUT:30}
order.cod.poll-delay-ms=${COD_POLL_DELAY_MS:60000}
inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}
grpc.client.product-verify.address=static://${PRODUCT_GRPC_ADDRESS:localhost:9091}
grpc.client.product-verify.negotiation-type=plaintext

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=1.0
