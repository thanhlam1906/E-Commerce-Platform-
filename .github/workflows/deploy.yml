# =============================================================================
# Phase 1 deploy — STAGING (auto) + PROD (manual approval).
#
# Triggered by deploy.yml:
#   - automatically when the CI workflow completes successfully on main
#     (workflow_run -> CI conclusion success, head branch = main)
#   - manually via Actions -> Deploy -> Run workflow (workflow_dispatch)
#
# Flow (docs/requirements/11-implementation-phases.md §3.1):
#   CI pushes images (tag <sha> + latest) -> deploy STAGING (auto)
#     -> healthcheck must pass -> deploy PROD (manual approval, environment: production)
#
# PROD manual approval:
#   Set up the "production" environment in
#   Settings -> Environments -> New environment -> "production"
#   and add 1 required reviewer (this creates the Approve button in the run).
#   "staging" environment is optional (deployment tracking only).
#
# Assumptions:
#   - Compose files docker-compose.staging.yml / docker-compose.prod.yml live at
#     repo root (created alongside Dockerfiles by the Docker task). Adjust the
#     scp source if the Docker task puts them elsewhere.
#   - The deploy host has docker + docker compose plugin installed.
#   - Images are pulled from GHCR; if they are private the host needs GHCR_TOKEN
#     (PAT with read:packages) which is used to docker login on the host.
#   - The full stack healthcheck is done via the API Gateway (/actuator/health).
#     Per-service healthchecks live in the compose files themselves.
#
# GitHub Secrets required:
#   CI phase:
#     GITHUB_TOKEN              built-in (GHCR push, repo Packages: write)
#     GHCR_TOKEN                optional PAT (read:packages) if images are private
#     GHCR_USER                 optional registry username (defaults to repo owner)
#   Deploy (SSH):
#     STAGING_HOST              staging host (ssh host[:port])
#     STAGING_SSH_USER          staging ssh user
#     STAGING_SSH_KEY           staging ssh private key
#     PROD_HOST / PROD_SSH_USER / PROD_SSH_KEY   same for production
#   App secrets written to <host>:~/ecomerce/.env and consumed by containers:
#     INTERNAL_SERVICE_TOKEN    ApiGateway + Order + Payment + Identity + Notification
#                               (internal call auth — MUST be identical across services)
#     VNPAY_SECRET, VNPAY_TMN_CODE, VNPAY_RETURN_URL      Payment-Service
#     PAYMENT_RETURN_URL                                  Order-Service (VNPay return page)
#     DB_PASSWORD                                         REQUIRED — postgres instances (3 DBs)
#     CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
#                                                           Product-Catalog-Service
#     SMTP_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD Notification-Service
#     NOTIFICATION_EMAIL_FROM                               Notification-Service
#   Optional infra (uncomment in the .env write if your Redis/Kafka need them):
#     REDIS_PASSWORD, KAFKA_SASL_*
#
# Note: JWT keys (jwt.private-key-path / public-key-path in Identity) are FILES,
# not env vars — provision them on the host outside this workflow.
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # STAGING — automatic, gated on CI success. Deploys, then requires the API
  # Gateway healthcheck to pass on the host (fails the job if not healthy).
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
      VNPAY_SECRET: ${{ secrets.VNPAY_SECRET }}
      VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
      SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
      NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
      PAYMENT_RETURN_URL: ${{ secrets.PAYMENT_RETURN_URL }}
      VNPAY_RETURN_URL: ${{ secrets.VNPAY_RETURN_URL }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GHCR_USER: ${{ secrets.GHCR_USER || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Upload compose file to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "~/ecomerce"

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: INTERNAL_SERVICE_TOKEN,VNPAY_SECRET,VNPAY_TMN_CODE,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,SMTP_HOST,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD,NOTIFICATION_EMAIL_FROM,PAYMENT_RETURN_URL,VNPAY_RETURN_URL,DB_PASSWORD,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p ~/ecomerce
            cd ~/ecomerce
            : > .env
            printf 'INTERNAL_SERVICE_TOKEN=%s\n' "$INTERNAL_SERVICE_TOKEN" >> .env
            printf 'VNPAY_SECRET=%s\n' "$VNPAY_SECRET" >> .env
            printf 'VNPAY_TMN_CODE=%s\n' "$VNPAY_TMN_CODE" >> .env
            printf 'CLOUDINARY_CLOUD_NAME=%s\n' "$CLOUDINARY_CLOUD_NAME" >> .env
            printf 'CLOUDINARY_API_KEY=%s\n' "$CLOUDINARY_API_KEY" >> .env
            printf 'CLOUDINARY_API_SECRET=%s\n' "$CLOUDINARY_API_SECRET" >> .env
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST" >> .env
            printf 'SPRING_MAIL_USERNAME=%s\n' "$SPRING_MAIL_USERNAME" >> .env
            printf 'SPRING_MAIL_PASSWORD=%s\n' "$SPRING_MAIL_PASSWORD" >> .env
            printf 'NOTIFICATION_EMAIL_FROM=%s\n' "$NOTIFICATION_EMAIL_FROM" >> .env
            printf 'PAYMENT_RETURN_URL=%s\n' "$PAYMENT_RETURN_URL" >> .env
            printf 'VNPAY_RETURN_URL=%s\n' "$VNPAY_RETURN_URL" >> .env
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env
            if [ -n "$GHCR_TOKEN" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker compose -f docker-compose.staging.yml --env-file .env pull
            docker compose -f docker-compose.staging.yml --env-file .env up -d

      - name: Staging healthcheck (API Gateway)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "STAGING HEALTHY"
                exit 0
              fi
              sleep 5
            done
            echo "STAGING NOT HEALTHY"
            exit 1

  # ---------------------------------------------------------------------------
  # PROD — requires manual approval (environment: production, 1 required
  # reviewer). Only reachable after staging deployed + passed healthcheck.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
      VNPAY_SECRET: ${{ secrets.VNPAY_SECRET }}
      VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
      SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
      NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
      PAYMENT_RETURN_URL: ${{ secrets.PAYMENT_RETURN_URL }}
      VNPAY_RETURN_URL: ${{ secrets.VNPAY_RETURN_URL }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GHCR_USER: ${{ secrets.GHCR_USER || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Upload compose file to prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/ecomerce"

      - name: Deploy to prod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: INTERNAL_SERVICE_TOKEN,VNPAY_SECRET,VNPAY_TMN_CODE,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,SMTP_HOST,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD,NOTIFICATION_EMAIL_FROM,PAYMENT_RETURN_URL,VNPAY_RETURN_URL,DB_PASSWORD,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p ~/ecomerce
            cd ~/ecomerce
            : > .env
            printf 'INTERNAL_SERVICE_TOKEN=%s\n' "$INTERNAL_SERVICE_TOKEN" >> .env
            printf 'VNPAY_SECRET=%s\n' "$VNPAY_SECRET" >> .env
            printf 'VNPAY_TMN_CODE=%s\n' "$VNPAY_TMN_CODE" >> .env
            printf 'CLOUDINARY_CLOUD_NAME=%s\n' "$CLOUDINARY_CLOUD_NAME" >> .env
            printf 'CLOUDINARY_API_KEY=%s\n' "$CLOUDINARY_API_KEY" >> .env
            printf 'CLOUDINARY_API_SECRET=%s\n' "$CLOUDINARY_API_SECRET" >> .env
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST" >> .env
            printf 'SPRING_MAIL_USERNAME=%s\n' "$SPRING_MAIL_USERNAME" >> .env
            printf 'SPRING_MAIL_PASSWORD=%s\n' "$SPRING_MAIL_PASSWORD" >> .env
            printf 'NOTIFICATION_EMAIL_FROM=%s\n' "$NOTIFICATION_EMAIL_FROM" >> .env
            printf 'PAYMENT_RETURN_URL=%s\n' "$PAYMENT_RETURN_URL" >> .env
            printf 'VNPAY_RETURN_URL=%s\n' "$VNPAY_RETURN_URL" >> .env
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env
            if [ -n "$GHCR_TOKEN" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d

      - name: Prod healthcheck (API Gateway)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "PROD HEALTHY"
                exit 0
              fi
              sleep 5
            done
            echo "PROD NOT HEALTHY"
            exit 1
