spring.application.name=payment-service
spring.config.import=optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8084}

# PostgreSQL owns payment transactions (SRS §5). Port 5435 = postgres-payments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/payments?TimeZone=UTC}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

# Internal endpoints are authenticated by this shared bearer token (same value Order-Service sends).
internal.service-token=${INTERNAL_SERVICE_TOKEN:}
payment.kafka-topic=${PAYMENT_EVENTS_TOPIC:payment.events}
payment.outbox-poll-delay-ms=${PAYMENT_OUTBOX_POLL_DELAY_MS:1000}
payment.expiry-poll-ms=${EXPIRY_POLL_MS:60000}
payment.timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:15}
# Sandbox simulator is OFF by default. Must be explicitly enabled (PAYMENT_SANDBOX_ENABLED=true) for local dev only;
# even then /webhooks/sandbox/** requires the internal.service-token bearer (see SecurityConfig).
payment.sandbox.enabled=${PAYMENT_SANDBOX_ENABLED:false}
payment.sandbox.return-url-base=${PAYMENT_SANDBOX_RETURN_URL_BASE:http://localhost:8084}
# HMAC secrets for webhook verification. Blank = reject (fail closed). Real adapters set via env/vault.
payment.webhook.allow-unsigned=${PAYMENT_WEBHOOK_ALLOW_UNSIGNED:false}
payment.gateway-secrets.vnpay=${VNPAY_SECRET:}
payment.gateway-secrets.momo=${MOMO_SECRET:}
payment.gateway-secrets.stripe=${STRIPE_SECRET:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%p","service":"${spring.application.name}","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","thread":"%t","logger":"%c","message":"%m"}%n
