<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Đặt lại mật khẩu</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4;">
<div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 24px;">
    <h2 style="color: #1a73e8;">VoltStack Ecommerce</h2>
    <h3>Đặt lại mật khẩu</h3>
    <p>Nhấn vào nút bên dưới để đặt lại mật khẩu. Liên kết có hiệu lực trong 30 phút.</p>
    <p th:if="${resetLink != null and !resetLink.isEmpty()}">
        <a th:href="${resetLink}" style="background: #1a73e8; color: #ffffff; padding: 10px 16px; text-decoration: none; border-radius: 4px;">Đặt lại mật khẩu</a>
    </p>
    <p>Nếu bạn không yêu cầu thao tác này, hãy bỏ qua email này.</p>
</div>
</body>
</html>
