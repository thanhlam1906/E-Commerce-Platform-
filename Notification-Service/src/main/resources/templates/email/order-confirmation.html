<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Đơn hàng đã được tạo</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4;">
<div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 24px;">
    <h2 style="color: #1a73e8;">VoltStack Ecommerce</h2>
    <h3>Đơn hàng của bạn đã được tạo</h3>
    <p>Mã đơn hàng: <strong th:text="${orderNumber}">OR-000000</strong></p>
    <p>Tổng tiền: <strong th:text="${totalAmount}">0</strong> <strong th:text="${currency}">VND</strong></p>
    <div th:if="${items != null and !items.isEmpty()}">
        <h4>Chi tiết đơn hàng</h4>
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
            <tr>
                <th style="text-align: left; border-bottom: 1px solid #ddd;">Sản phẩm</th>
                <th style="border-bottom: 1px solid #ddd;">Số lượng</th>
                <th style="border-bottom: 1px solid #ddd;">Thành tiền</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.productName}"></td>
                <td style="text-align: center;" th:text="${item.quantity}"></td>
                <td style="text-align: right;" th:text="${item.subtotal}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${paymentUrl != null and !paymentUrl.isEmpty()}">
        <a th:href="${paymentUrl}" style="background: #1a73e8; color: #ffffff; padding: 10px 16px; text-decoration: none; border-radius: 4px;">Thanh toán ngay</a>
    </p>
    <p>Cảm ơn bạn đã mua sắm tại VoltStack!</p>
</div>
</body>
</html>
