spring.application.name=notification-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8085}

# MongoDB: notification_logs is the durable idempotency store and local job fallback.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/notification}
spring.data.mongodb.auto-index-creation=true

# Kafka consumes the shared envelope. Producers can override topic/group without code changes.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_KAFKA_CONSUMER_GROUP:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.voltstack.ecommerce.notification
spring.kafka.listener.ack-mode=manual_immediate

# Redis is optional locally. Set NOTIFICATION_QUEUE_TYPE=redis in deployed environments.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# SMTP is intentionally opt-in. `log` is a metadata-only local provider; no message body is logged.
# spring.mail.host only triggers JavaMailSender bean creation; it is used solely when provider=smtp.
spring.mail.host=${SMTP_HOST:localhost}
notification.email.provider=${NOTIFICATION_EMAIL_PROVIDER:log}
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@localhost}
notification.queue.type=${NOTIFICATION_QUEUE_TYPE:mongo}
notification.queue.redis-key=${NOTIFICATION_REDIS_QUEUE_KEY:notification:email:jobs}
notification.kafka.events-topic=${NOTIFICATION_EVENTS_TOPIC:order.events,ecommerce.events}
notification.kafka.dlq-topic=${NOTIFICATION_DLQ_TOPIC:notification.dlq}
notification.kafka.dlq-publish-enabled=${NOTIFICATION_DLQ_PUBLISH_ENABLED:false}
notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
notification.retry.first-delay-seconds=${NOTIFICATION_RETRY_FIRST_DELAY_SECONDS:30}
notification.retry.second-delay-seconds=${NOTIFICATION_RETRY_SECOND_DELAY_SECONDS:60}
notification.worker.fixed-delay-ms=${NOTIFICATION_WORKER_FIXED_DELAY_MS:1000}
notification.worker.batch-size=${NOTIFICATION_WORKER_BATCH_SIZE:20}
notification.worker.lease-seconds=${NOTIFICATION_WORKER_LEASE_SECONDS:60}

# Rate limit: at most N emails per recipient per minute; over-limit jobs are delayed, not dropped.
notification.rate-limit.max-per-minute=${NOTIFICATION_RATE_LIMIT_MAX_PER_MINUTE:5}
notification.rate-limit.retry-delay-seconds=${NOTIFICATION_RATE_LIMIT_RETRY_DELAY_SECONDS:60}

# Eureka
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

# Monitoring and structured, correlation-aware logs.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=1.0
logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%p","service":"${spring.application.name}","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","thread":"%t","logger":"%c","message":"%m"}%n
