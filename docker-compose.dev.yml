# Dev compose — everything in Docker, optimised for local iteration.
#
#   * 4 services WITH spring-boot-devtools (product-catalog, identity, order,
#     payment) run `gradle bootRun` from mounted source -> hot reload + volume
#     mount source. Each gets its OWN gradle home volume (a shared one deadlocks
#     on the gradle journal lock because bootRun holds it for the app lifetime).
#   * Services WITHOUT devtools (eureka x2, config, gateway, notification) run
#     the built image (no source-mount, no hot reload — they have none to give).
#
# Usage:  docker compose -f docker-compose.dev.yml up --build
# Secrets from root .env. INTERNAL_SERVICE_TOKEN must be IDENTICAL across
# api-gateway + order-service + payment-service, or all requests 401.
# Not used for image scanning (staging/prod concern).

name: ecommerce-dev

x-common-env: &common-env
  EUREKA_URI: "http://eureka-server:8761/eureka/,http://eureka-server-2:8762/eureka/"
  CONFIG_SERVER_URL: "http://config-server:8888"
  SPRING_PROFILES_ACTIVE: local
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}

x-devrun: &devrun
  image: gradle:jdk23
  working_dir: /app
  command: ["gradle", "bootRun", "--no-daemon"]

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost/actuator/health || exit 1"]
  interval: 30s
  timeout: 5s
  start_period: 60s
  retries: 3

volumes:
  pgdata:
  orders_pgdata:
  payments_pgdata:
  mongo_data:
  catalog-gradle:
  identity-gradle:
  order-gradle:
  payment-gradle:

services:
  # ============================== INFRA ==============================
  postgres:
    image: postgres:16
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-orders:
    image: postgres:16
    container_name: order-postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes: [orders_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-payments:
    image: postgres:16
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5435:5432"]
    volumes: [payments_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: gateway-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ============================ DISCOVERY / CONFIG ============================
  eureka-server:
    build: ./Eureka-Server
    image: eureka-server:dev
    container_name: eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: peer1
      INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server-2:8762/eureka/"
    ports: ["8761:8761"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
    restart: unless-stopped

  eureka-server-2:
    build: ./Eureka-Server
    image: eureka-server:dev
    container_name: eureka-server-2
    environment:
      SPRING_PROFILES_ACTIVE: peer2
      INSTANCE_HOSTNAME: eureka-server-2
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    ports: ["8762:8762"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8762/actuator/health || exit 1"]
    restart: unless-stopped

  config-server:
    build: ./Config-Server
    image: config-server:dev
    container_name: config-server
    environment:
      <<: *common-env
      INSTANCE_HOSTNAME: config-server
    ports: ["8888:8888"]
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]
    restart: unless-stopped

  # =============================== GATEWAY ===============================
  api-gateway:
    build: ./ApiGateway
    image: api-gateway:dev
    container_name: api-gateway
    environment:
      <<: *common-env
      INSTANCE_HOSTNAME: api-gateway
      REDIS_HOST: redis
      JWT_JWKS_URI: "http://identity-service:8082/.well-known/jwks.json"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
    restart: unless-stopped

  # =================== SERVICES (hot-reload: gradle bootRun) ===================
  product-catalog-service:
    <<: *devrun
    container_name: product-catalog-service
    volumes:
      - ./Product-Catalog-Service:/app
      - catalog-gradle:/home/gradle/.gradle
    environment:
      <<: *common-env
      INSTANCE_HOSTNAME: product-catalog-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/product-catalog"
      GRPC_SERVER_PORT: 9091
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports: ["8081:8081", "9091:9091"]
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped

  identity-service:
    <<: *devrun
    container_name: identity-service
    volumes:
      - ./Identity-Service:/app
      - identity-gradle:/home/gradle/.gradle
    environment:
      <<: *common-env
      INSTANCE_HOSTNAME: identity-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      DB_URL: "jdbc:postgresql://postgres:5432/identity?TimeZone=UTC"
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_FRONTEND_BASE_URL: ${IDENTITY_FRONTEND_BASE_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    <<: *devrun
    container_name: order-service
    volumes:
      - ./Order-Service:/app
      - order-gradle:/home/gradle/.gradle
    environment:
      <<: *common-env
      INSTANCE_HOSTNAME: order-service
      DB_URL: "jdbc:postgresql://postgres-orders:5432/orders?TimeZone=UTC"
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_GRPC_ADDRESS: "product-catalog-service:9091"
      PRODUCT_CATALOG_URL: "http://product-catalog-service:8081"
      IDENTITY_SERVICE_URL: "http://identity-service:8082"
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
    ports: ["8083:8083"]
    depends_on:
      postgres-orders:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    <<: *devrun
    container_name: payment-service
    volumes:
      - ./Payment-Service:/app
      - payment-gradle:/home/gradle/.gradle
    environment:
      <<: *common-env
      INSTANCE_HOSTNAME: payment-service
      DB_URL: "jdbc:postgresql://postgres-payments:5432/payments?TimeZone=UTC"
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VNPAY_SECRET: ${VNPAY_SECRET:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/v1/payments/vnpay/return}
      VNPAY_IP_ADDR: ${VNPAY_IP_ADDR:-127.0.0.1}
      PAYMENT_SANDBOX_ENABLED: ${PAYMENT_SANDBOX_ENABLED:-false}
    ports: ["8084:8084"]
    depends_on:
      postgres-payments:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped

  # Notification has no devtools -> built image (rebuild with `--build` to iterate).
  notification-service:
    build: ./Notification-Service
    image: notification-service:dev
    container_name: notification-service
    environment:
      <<: *common-env
      INSTANCE_HOSTNAME: notification-service
      MONGODB_URI: "mongodb://mongodb:27017/notification"
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-log}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-no-reply@localhost}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    ports: ["8085:8085"]
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
    restart: unless-stopped
