services:
  postgres:
    image: postgres:16
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gateway-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
