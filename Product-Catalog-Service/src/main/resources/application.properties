spring.application.name=Product-Catalog-Service
spring.profiles.active=local
spring.config.import=optional:file:.env[.properties],optional:configserver:http://localhost:8888
server.port=8081
spring.data.mongodb.uri=mongodb://localhost:27017/product-catalog

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

# Monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0

# Structured JSON logging with correlation ID
logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%p","service":"${spring.application.name}","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","thread":"%t","logger":"%c","message":"%m"}%n