spring.application.name=Product-Catalog-Service
spring.profiles.active=local
spring.config.import=optional:file:.env[.properties],optional:configserver:http://localhost:8888
server.port=8081
grpc.server.port=${GRPC_SERVER_PORT:9091}
spring.data.mongodb.uri=mongodb://localhost:27017/product-catalog
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Eureka
# Register with localhost, not the Windows hostname (LENOVO.mshome.net) — the
# Hyper-V DNS suffix is unresolvable, so the gateway's lb:// lookup would fail.
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

# Monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=1.0